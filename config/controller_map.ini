; Mapa do DualShock 4 para as constantes de gamepad do GameMaker.
; O mod de ícones PS4 precisa mostrar cada símbolo na posição correspondente.
[ps4_to_gamemaker]
cross=gp_face1
circle=gp_face2
square=gp_face3
triangle=gp_face4
l1=gp_shoulderl
r1=gp_shoulderr
l2=gp_shoulderlb
r2=gp_shoulderrb
share=gp_select
options=gp_start
l3=gp_stickl
r3=gp_stickr
dpad_up=gp_padu
dpad_down=gp_padd
dpad_left=gp_padl
dpad_right=gp_padr
