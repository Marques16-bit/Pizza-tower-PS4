; Preset gráfico FIXO do port PS4.
; Valores de projeto: ainda precisam ser ligados ao runner (ver patches/README.md).
; Comentários ficam em linhas próprias.
[video]
output_width=1920
output_height=1080
fullscreen=1
vsync=1
; aspect_fit | integer | stretch
scale_mode=aspect_fit
; nearest | linear
texture_filter=nearest
target_fps=60

[locked]
; Funções GML de vídeo que o runner deve ignorar no PS4 (lista inicial, a confirmar).
; Assim a tela Video Settings do jogo não consegue mudar nada.
window_set_fullscreen=ignore
window_set_size=ignore
window_set_position=ignore
display_reset=ignore
