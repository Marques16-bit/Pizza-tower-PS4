name: Gerar PKG
on:
  push:
    branches: [main]
    paths-ignore: ['repo.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm cmake
      - name: Toolchain OpenOrbis
        run: bash scripts/setup_toolchain.sh
      - name: Baixar Butterscotch
        run: bash scripts/fetch_butterscotch.sh
      - name: Compilar e empacotar
        run: bash scripts/build_ps4.sh
      - name: Publicar o pkg
        uses: actions/upload-artifact@v4
        with:
          name: pizza-tower-pkg
          path: out/*.pkg
          if-no-files-found: error
      - name: Diagnóstico (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: out/info/
