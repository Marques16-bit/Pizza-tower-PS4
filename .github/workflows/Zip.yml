name: ps4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar repo.zip na raiz
        if: ${{ hashFiles('repo.zip') != '' }}
        run: |
          unzip -o repo.zip -x '.github/*'
          git rm -q repo.zip
          git add -A
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Descompacta repo.zip"
          git push origin HEAD:${{ github.ref_name }}
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake unzip
      - name: Toolchain OpenOrbis
        run: bash scripts/setup_toolchain.sh
      - name: Sanity (hello_world)
        run: bash scripts/sanity_sample.sh
      - name: Butterscotch PS4
        run: |
          bash scripts/fetch_butterscotch.sh
          bash scripts/build_ps4.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps4-out
          path: out/
